<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalimba Harmonia — Gerador de imagens educativas</title>
<style>
:root{--cream:#f5f0e3;--wood:#d6b98c;--green:#456b4a;--dark:#344638;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:var(--dark);font-family:Arial,sans-serif}
.toolbar{max-width:1180px;margin:18px auto;padding:14px 18px;background:var(--white);border-radius:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar label{font-weight:700}.toolbar select,.toolbar button{font:inherit;padding:10px 13px;border-radius:9px;border:1px solid #9aa693;background:white;color:var(--dark)}
.toolbar button{background:var(--green);color:white;border:0;cursor:pointer}
.hint{font-size:13px;color:#5e6a5e;flex-basis:100%}
.poster{width:min(1180px,calc(100% - 24px));margin:0 auto 24px;background:var(--white);border:5px solid var(--green);border-radius:22px;padding:clamp(14px,2.5vw,28px);box-shadow:0 12px 30px #263a2b22}
.top{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:center;margin-bottom:18px}
.brand{background:linear-gradient(110deg,#163d20,#456b4a);color:white;border-radius:50px 50px 50px 8px;padding:12px 20px;text-align:center}
.brand b{display:block;font:700 clamp(22px,3vw,34px) Georgia,serif}.brand span{font:italic 15px Georgia,serif;color:#f4e5a5}
h1{margin:0;background:#fff2c8;border:2px solid #c69b36;border-radius:40px;padding:13px;text-align:center;font:700 clamp(20px,2.5vw,30px) Georgia,serif;color:#18291c}
.subtitle{text-align:center;font:600 17px Georgia,serif;background:#fff8e5;border:2px solid #d5b36a;border-radius:18px;padding:13px;margin-bottom:18px}
.layout{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}
.panel{background:#f7f2e7;border-radius:17px;padding:15px}
h2{font:700 21px Georgia,serif;margin:0 0 10px}
.instrument{width:100%;height:auto;display:block}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.legend-item{background:white;border-radius:12px;padding:7px;display:flex;align-items:center;gap:8px;font:600 16px Georgia,serif}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:white;font:bold 17px Arial;flex:none}
.ex{margin-top:17px;background:#fffdf8;border:2px solid #d8c69e;border-radius:17px;padding:15px}
.sequence{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.seq{background:var(--green);color:white;border-radius:10px;padding:9px 13px;font:bold 21px Arial}
.ex p,.tip p,.callouts{font:15px/1.45 Arial,sans-serif;margin:8px 0}
.tip{margin-top:12px;background:linear-gradient(130deg,#173b20,#344638);color:white;border:3px solid #e2c65c;border-radius:17px;padding:15px}
.tip h2{color:#ffe36b}.callouts{margin-top:12px;background:#fff1c8;border-radius:12px;padding:12px}
footer{text-align:center;font:italic 13px Georgia,serif;color:#647263;margin-top:15px}
@media(max-width:760px){.top,.layout{grid-template-columns:1fr}.toolbar{margin:10px}.poster{width:calc(100% - 16px)}}
@media print{body{background:white}.toolbar{display:none}.poster{width:100%;margin:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="toolbar">
<label for="lesson">Pré-visualizar aula:</label>
<select id="lesson"></select>
<button id="print">Imprimir / salvar como PDF</button>
<span class="hint">Modelo reutilizável: selecione uma aula. Para preencher as demais, edite o arquivo conteudo_aulas_kalimba.json e mantenha o mesmo formato de campos.</span>
</div>
<main class="poster" id="poster">
<div class="top">
<div class="brand"><b>♫ Kalimba Harmonia</b><span>Aprender é fazer musical!</span></div>
<h1 id="title">Aula 2 — Como ler os números da kalimba</h1>
</div>
<div class="subtitle" id="subtitle"></div>
<div class="layout">
<section class="panel">
<h2>Veja na kalimba</h2>
<svg class="instrument" viewBox="0 0 760 440" role="img" aria-label="Kalimba educativa com lâminas numeradas">
<defs><linearGradient id="bodyWood" x2="0" y2="1"><stop stop-color="#e7c99a"/><stop offset="1" stop-color="#996637"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#aeb5b7"/></linearGradient></defs>
<rect x="104" y="76" width="552" height="340" rx="42" fill="url(#bodyWood)" stroke="#79502d" stroke-width="7"/>
<circle cx="380" cy="345" r="38" fill="#57351e" stroke="#d6b98c" stroke-width="6"/>
<rect x="139" y="105" width="482" height="24" rx="8" fill="#aeb4b5" stroke="#596064" stroke-width="3"/>
<g id="tines"></g>
<text x="380" y="47" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#344638">Ponto de referência: lâmina central</text>
<path d="M380 55 L380 91" stroke="#456b4a" stroke-width="4" stroke-linecap="round"/>
<text x="380" y="405" text-anchor="middle" font-family="Arial" font-size="16" fill="#fffdf8">Corpo de madeira • lâminas metálicas</text>
</svg>
<div class="callouts" id="callouts"></div>
</section>
<aside>
<section class="panel">
<h2>Legenda</h2><div class="legend" id="legend"></div>
</section>
<section class="ex">
<h2 id="example-label"></h2><p id="example-text"></p><div class="sequence" id="sequence"></div>
</section>
<section class="tip">
<h2 id="tip-title"></h2><p id="tip"></p>
</section>
</aside>
</div>
<footer>Kalimba Harmonia • Material didático</footer>
</main>
<script>
const fallback = {
 title:"Conteúdo da aula ainda não cadastrado",
 subtitle:"Adicione o conteúdo específico desta aula no arquivo JSON para gerar seu infográfico.",
 focus:"A imagem será preenchida automaticamente com o conteúdo cadastrado.",
 legend:[["1","Dó","#d92f2f"],["2","Ré","#f07822"],["3","Mi","#f2c500"],["4","Fá","#69a936"],["5","Sol","#287bc4"],["6","Lá","#8060a8"],["7","Si","#d64c91"]],
 example_label:"Exemplo da aula",example_text:"Insira aqui um exercício que corresponda ao conteúdo desta aula.",
 sequence:["1","2","3"],tip_title:"Dica musical",tip:"Insira uma orientação importante desta aula.",callouts:["Adicione uma explicação visual","Adicione uma indicação importante"]
};
let lessons = {};
const selector=document.getElementById("lesson");
for(let i=1;i<=50;i++){const o=document.createElement("option");o.value=i;o.textContent=`Aula ${i}`;selector.appendChild(o);}
function render(data,n){
 document.getElementById("title").textContent=`Aula ${n} — ${data.title}`;
 document.getElementById("subtitle").textContent=data.subtitle;
 document.getElementById("example-label").textContent=data.example_label;
 document.getElementById("example-text").textContent=data.example_text;
 document.getElementById("tip-title").textContent=data.tip_title;
 document.getElementById("tip").textContent=data.tip;
 document.getElementById("callouts").innerHTML=(data.callouts||[]).map(x=>`• ${escapeHtml(x)}`).join("<br>");
 document.getElementById("legend").innerHTML=data.legend.map(([num,note,color])=>`<div class="legend-item"><span class="dot" style="background:${color}">${escapeHtml(num)}</span>${escapeHtml(note)}</div>`).join("");
 document.getElementById("sequence").innerHTML=data.sequence.map(x=>`<span class="seq">${escapeHtml(x)}</span>`).join("");
 const g=document.getElementById("tines");g.innerHTML="";
 const nums=data.sequence.length?data.sequence:["1","2","3","4","5","6","7"];
 const colors=Object.fromEntries(data.legend.map(x=>[x[0],x[2]]));
 const labels=["5","3","1","6","4","2","1","3","5","7","2","4","6","1","3","5","7"];
 for(let i=0;i<17;i++){
  const x=143+i*29.5, h=150+Math.round((1-Math.abs(i-8)/9)*110);
  const label=labels[i], color=colors[label]||"#456b4a", y=129;
  const group=document.createElementNS("http://www.w3.org/2000/svg","g");
  group.innerHTML=`<rect x="${x}" y="${y}" width="23" height="${h}" rx="7" fill="url(#metal)" stroke="#687174" stroke-width="2"/><circle cx="${x+11.5}" cy="${y+h-12}" r="14" fill="${color}"/><text x="${x+11.5}" y="${y+h-7}" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">${label}</text>`;
  g.appendChild(group);
 }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
fetch("conteudo_aulas_kalimba.json").then(r=>r.ok?r.json():{}).then(d=>{lessons=d;load();}).catch(()=>load());
function load(){const n=selector.value;render(lessons[n]||fallback,n);}
selector.addEventListener("change",load);
document.getElementById("print").addEventListener("click",()=>window.print());
selector.value="2";
</script>
</body></html>
